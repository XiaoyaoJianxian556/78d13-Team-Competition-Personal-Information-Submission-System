<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>比赛个人信息填报系统</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #0f1117;
    color: #e6e8ee;
    line-height: 1.6;
  }

  .page {
    max-width: 980px;
    margin: 0 auto;
    padding: 0 16px 80px;
  }

  /* ---------- 页头 ---------- */
  .site-header {
    text-align: center;
    padding: 34px 12px 26px;
    border-bottom: 1px solid #232838;
    margin-bottom: 26px;
  }
  .site-header .brand {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #f0b429;
    text-shadow: 0 0 24px rgba(240, 180, 41, .28);
  }
  .site-header h1 {
    font-size: 15px;
    font-weight: 500;
    color: #8b93a7;
    margin: 10px 0 0;
    letter-spacing: 3px;
  }

  /* ---------- 卡片 ---------- */
  .card {
    background: #181b24;
    border: 1px solid #232838;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 18px;
  }
  .card h2 {
    font-size: 16px;
    margin: 0 0 16px;
    padding-left: 10px;
    border-left: 3px solid #4f8cff;
    line-height: 1.2;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .hint {
    font-size: 12px;
    color: #8b93a7;
    font-weight: 400;
    border: none;
  }
  .hint b { color: #4f8cff; }

  /* ---------- 比赛信息 ---------- */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  .match-selector {
    margin-bottom: 16px;
  }
  .match-selector label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: #8b93a7;
  }
  .info-item {
    background: #12151d;
    border: 1px solid #232838;
    border-radius: 8px;
    padding: 10px 13px;
  }
  .info-item .k {
    font-size: 12px;
    color: #8b93a7;
    margin-bottom: 2px;
  }
  .info-item .v {
    font-size: 15px;
    font-weight: 600;
    color: #e6e8ee;
    word-break: break-all;
  }

  /* ---------- 表单 ---------- */
  .form-row {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 14px;
    align-items: center;
    margin-bottom: 14px;
  }
  .form-row:last-child { margin-bottom: 0; }
  .form-row > label {
    font-size: 14px;
    color: #a8b0c2;
  }
  .input-with-action {
    display: flex;
    gap: 8px;
  }
  .input-with-action input { flex: 1; }
  .search-status {
    margin-top: 6px;
    font-size: 12px;
    color: #8b93a7;
  }

  input, select, textarea {
    width: 100%;
    background: #12151d;
    border: 1px solid #2c3142;
    border-radius: 8px;
    color: #e6e8ee;
    padding: 9px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus {
    border-color: #4f8cff;
    box-shadow: 0 0 0 3px rgba(79, 140, 255, .15);
  }
  input::placeholder { color: #5b6379; }
  select { cursor: pointer; }

  /* ---------- 车位 ---------- */
  .slot {
    border: 1px solid #262c3c;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 14px;
    background: #14171f;
  }
  .slot-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .slot-title {
    font-weight: 600;
    color: #cfd5e3;
    font-size: 14px;
  }
  .slot-title b { color: #4f8cff; }
  .slot-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
    gap: 12px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: #8b93a7;
  }
  .vehicle-name-controls {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ---------- 按钮 ---------- */
  .btn {
    border: 1px solid #2c3142;
    background: #1d2230;
    color: #e6e8ee;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: background .15s, border-color .15s, transform .05s;
  }
  .btn:hover { background: #262c3d; border-color: #3a4157; }
  .btn:active { transform: translateY(1px); }
  .btn.primary {
    background: #4f8cff;
    border-color: #4f8cff;
    color: #fff;
    font-weight: 600;
  }
  .btn.primary:hover { background: #3d7bf0; border-color: #3d7bf0; }
  .btn.tiny { padding: 4px 11px; font-size: 12px; border-radius: 6px; }
  .btn.danger {
    background: transparent;
    border-color: #3a2630;
    color: #ff7a7a;
  }
  .btn.danger:hover { background: #2a1a20; border-color: #5c3340; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }

  /* ---------- 操作区 & 输出 ---------- */
  .actions {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 22px 0 18px;
  }

  .panel {
    background: #181b24;
    border: 1px solid #232838;
    border-radius: 12px;
    margin-bottom: 18px;
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 16px;
    background: #14171f;
    border-bottom: 1px solid #232838;
    font-size: 13px;
    color: #a8b0c2;
    letter-spacing: .5px;
  }

  .md-body { padding: 16px 20px; overflow-x: auto; }
  .md-body table {
    border-collapse: collapse;
    margin: 0;
    font-size: 14px;
    white-space: nowrap;
  }
  .md-body th, .md-body td {
    border: 1px solid #2c3142;
    padding: 8px 12px;
    text-align: left;
    vertical-align: top;
  }
  .md-body th { background: #1d2230; color: #cfd5e3; font-weight: 600; }
  .md-body td { background: #14171f; }

  /* ---------- 提示条 ---------- */
  .tpl-tip {
    font-size: 12px;
    color: #8b93a7;
    margin-top: 10px;
    line-height: 1.9;
  }
  .tpl-tip code {
    background: #232838;
    padding: 1px 6px;
    border-radius: 4px;
    color: #a8b0c2;
  }

  .foot {
    text-align: center;
    font-size: 12px;
    color: #5b6379;
    margin-top: 34px;
    letter-spacing: .5px;
  }
  .foot code { color: #8b93a7; }

  /* ---------- 移动端 ---------- */
  @media (max-width: 560px) {
    .site-header .brand { font-size: 24px; }
    .form-row { grid-template-columns: 1fr; gap: 6px; }
    .actions .btn { flex: 1 1 100%; }
  }
</style>
</head>
<body>
<div class="page">

  <header class="site-header">
    <div class="brand">=78D13= matches</div>
    <h1>比赛个人信息填报系统</h1>
  </header>

  <!-- 本次比赛信息 -->
  <section class="card">
    <h2>本次比赛信息</h2>
    <div class="match-selector">
      <label for="matchSelect">选择比赛</label>
      <select id="matchSelect" disabled>
        <option value="">正在读取比赛列表...</option>
      </select>
    </div>
    <div class="info-grid" id="matchInfoGrid"></div>
  </section>

  <!-- 个人信息 -->
  <section class="card">
    <h2>个人信息</h2>
    <div class="form-row">
      <label for="nickname">战雷游戏内昵称</label>
      <div>
        <div class="input-with-action">
          <input id="nickname" type="text" placeholder="请输入游戏内昵称" autocomplete="off" />
          <button type="button" class="btn" id="btnSearchId">搜索 ID</button>
        </div>
        <div class="search-status" id="searchStatus" aria-live="polite"></div>
      </div>
    </div>
    <div class="form-row">
      <label for="gaijinId">玩家 ID</label>
      <input id="gaijinId" type="text" placeholder="搜索不到时请手动输入" inputmode="numeric" autocomplete="off" />
    </div>
    <div class="form-row">
      <label for="team">所属队伍</label>
      <select id="team"></select>
    </div>
    <div class="form-row">
      <label for="identity">身份</label>
      <select id="identity">
        <option value="">请选择身份</option>
        <option value="队长">队长</option>
        <option value="队员">队员</option>
      </select>
    </div>
    <div class="form-row">
      <label for="techTree">所用科技树</label>
      <select id="techTree"></select>
    </div>
  </section>

  <!-- 车位 -->
  <section class="card">
    <h2>车位信息 <span class="hint">最多 <b id="maxSlotsHint">–</b> 个</span></h2>
    <div id="slots"></div>
    <button type="button" class="btn" id="btnAddSlot">＋ 添加车位</button>
  </section>

  <!-- 操作 -->
  <div class="actions">
    <button type="button" class="btn primary" id="btnDownload">复制 Markdown</button>
  </div>

  <footer class="foot">
    配置读取自 <code>config/available_matches</code> · =78D13=
  </footer>

</div>

<script>
(function () {
  'use strict';

  /* =========================================================
   *  常量
   * ========================================================= */

  const TECH_TREES = ['中系', '苏系', '德系', '英系', '美系', '以系', '意系', '瑞系', '法系', '日系'];
  const VEHICLE_TYPES = ['固定翼飞机', '直升机', '地面载具', '水面载具'];
  const VEHICLE_LEVELS = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];
  const VEHICLE_FILES = {
    '中系': 'china.json',
    '苏系': 'russia.json',
    '德系': 'german.json',
    '英系': 'british.json',
    '美系': 'usa.json',
    '以系': 'israel.json',
    '意系': 'italy.json',
    '瑞系': 'sweden.json',
    '法系': 'france.json',
    '日系': 'japan.json'
  };

  // 比赛 JSON 里可识别的键名（大小写 / 空格 / 冒号 / 下划线都会被忽略）
  const FIELD_DEFS = [
    { key: 'teams',      aliases: ['队伍', '所属队伍', '队伍列表', '联队', '联队列表', 'teams', 'team'] },
    { key: 'maxSlots',   aliases: ['最大车位', '最大车位数', '车位数', '最多车位', '车位上限', 'maxslots', 'slots'] },
    { key: 'mode',       aliases: ['比赛模式', '模式', 'mode'] },
    { key: 'difficulty', aliases: ['难度', 'difficulty'] },
    { key: 'condition',  aliases: ['条件', '比赛条件', 'condition'] },
    { key: 'time',       aliases: ['时间', '比赛时间', 'time'] },
    { key: 'fuel',       aliases: ['燃料有限', '燃料', 'fuel'] },
    { key: 'ammo',       aliases: ['弹药有限', '弹药', 'ammo', 'ammunition'] },
    { key: 'respawn',    aliases: ['重生次数限制', '重生次数', '重生限制', 'respawn'] },
    { key: 'rounds',     aliases: ['比赛局数', '局数', 'rounds'] }
  ];

  // 页面「本次比赛信息」的显示顺序
  const MATCH_FIELDS = [
    { key: 'mode',       label: '比赛模式' },
    { key: 'difficulty', label: '难度' },
    { key: 'condition',  label: '条件' },
    { key: 'time',       label: '时间' },
    { key: 'fuel',       label: '燃料有限' },
    { key: 'ammo',       label: '弹药有限' },
    { key: 'respawn',    label: '重生次数限制' },
    { key: 'rounds',     label: '比赛局数' }
  ];

  const DEFAULT_MAX_SLOTS = 5;

  /* =========================================================
   *  状态
   * ========================================================= */

  let maxSlots = DEFAULT_MAX_SLOTS;
  let configValues = {};
  let members = [];
  let vehicleCatalog = [];
  let vehicleLoadToken = 0;

  const slotsEl = document.getElementById('slots');

  /* =========================================================
   *  通用工具
   * ========================================================= */

  function normKey(s) {
    return String(s).toLowerCase().replace(/[\s_\-:：]/g, '');
  }

  const LOOKUP = {};
  FIELD_DEFS.forEach(function (f) {
    f.aliases.forEach(function (a) { LOOKUP[normKey(a)] = f.key; });
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function splitList(v) {
    if (Array.isArray(v)) return v.map(function (s) { return String(s).trim(); }).filter(Boolean);
    return String(v).split(/[,，;；|、]+/).map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function parseCsvLine(line) {
    const cells = [];
    let cell = '';
    let quoted = false;

    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"' && quoted && line[i + 1] === '"') {
        cell += '"';
        i++;
      } else if (ch === '"') {
        quoted = !quoted;
      } else if (ch === ',' && !quoted) {
        cells.push(cell.trim());
        cell = '';
      } else {
        cell += ch;
      }
    }
    cells.push(cell.trim());
    return cells;
  }

  function parseMembersCsv(text) {
    const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(function (line) { return line.trim(); });
    if (!lines.length) return [];

    const headers = parseCsvLine(lines[0]);
    const idIndex = headers.indexOf('gaijin_id');
    const nameIndex = headers.indexOf('name');
    if (idIndex < 0 || nameIndex < 0) return [];

    return lines.slice(1).map(function (line) {
      const cells = parseCsvLine(line);
      return { id: cells[idIndex] || '', name: cells[nameIndex] || '' };
    }).filter(function (member) { return member.id && member.name; });
  }

  function decodeCsv(buffer) {
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(buffer);
    } catch (err) {
      return new TextDecoder('gb18030').decode(buffer);
    }
  }

  async function loadMembers() {
    try {
      const res = await fetch('config/teammate_info/members.csv', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      members = parseMembersCsv(decodeCsv(await res.arrayBuffer()));
    } catch (err) {
      console.warn('[=78D13=] 读取 members.csv 失败：', err);
      members = [];
    }
  }

  function searchPlayerId() {
    const nickname = document.getElementById('nickname').value.trim();
    const idInput = document.getElementById('gaijinId');
    const status = document.getElementById('searchStatus');

    if (!nickname) {
      status.textContent = '请先填写游戏内昵称';
      idInput.focus();
      return;
    }

    const normalizeNickname = function (value) {
      return String(value).toLowerCase().replace(/[\s_]+/g, '');
    };
    const matched = members.find(function (member) {
      return normalizeNickname(member.name) === normalizeNickname(nickname);
    });
    if (matched) {
      idInput.value = matched.id;
      status.textContent = '已找到玩家 ID';
      return;
    }

    idInput.value = '';
    status.textContent = '未找到该昵称，请自行输入玩家 ID';
    idInput.focus();
  }

  /* =========================================================
  *  比赛 JSON 解析
   * ========================================================= */

  function findSeparator(line) {
    const cands = [];
    ['=', ':', '：'].forEach(function (ch) {
      const i = line.indexOf(ch);
      if (i > 0) cands.push({ index: i, len: ch.length });
    });
    if (!cands.length) return null;
    cands.sort(function (a, b) { return a.index - b.index; });
    return cands[0];
  }

  function parseConfig(data) {
    const raw = data && typeof data === 'object' ? data : {};
    const cfg = {};
    Object.keys(raw).forEach(function (nk) {
      const fk = LOOKUP[normKey(nk)];
      if (fk) cfg[fk] = Array.isArray(raw[nk]) ? raw[nk].join(', ') : String(raw[nk]);
    });
    return cfg;
  }

  function applyConfig(cfg) {
    configValues = cfg || {};

    const n = parseInt(configValues.maxSlots, 10);
    maxSlots = (Number.isFinite(n) && n > 0) ? n : DEFAULT_MAX_SLOTS;

    renderMatchInfo();
    renderTeams();

    document.getElementById('maxSlotsHint').textContent = maxSlots;

    // 若配置下发的上限比已存在的车位少，裁掉多余车位
    const exist = slotsEl.querySelectorAll('.slot').length;
    if (exist > maxSlots) {
      const all = slotsEl.querySelectorAll('.slot');
      for (let i = maxSlots; i < all.length; i++) all[i].remove();
    }
    renumberSlots();
  }

  function setMatchOptions(matches) {
    const sel = document.getElementById('matchSelect');
    sel.innerHTML = '';

    matches.forEach(function (match, index) {
      const option = document.createElement('option');
      option.value = match.file;
      option.textContent = match.name || match.id || match.file;
      if (index === 0) option.selected = true;
      sel.appendChild(option);
    });

    sel.disabled = !matches.length;
  }

  async function loadMatch(file) {
    try {
      const res = await fetch('config/available_matches/' + encodeURIComponent(file), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      applyConfig(parseConfig(await res.json()));
    } catch (err) {
      console.warn('[=78D13=] 读取比赛 JSON 失败，已使用默认值：', err);
      applyConfig({});
    }
  }

  async function loadConfig() {
    const sel = document.getElementById('matchSelect');
    try {
      const res = await fetch('config/available_matches/index.json', { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const matches = Array.isArray(data) ? data : data.matches;
      if (!Array.isArray(matches) || !matches.length) throw new Error('比赛列表为空');

      const normalized = matches.map(function (match) {
        if (typeof match === 'string') {
          return { id: match, name: match, file: match.endsWith('.json') ? match : match + '.json' };
        }
        return {
          id: match.id || match.file,
          name: match.name || match.title || match.id || match.file,
          file: match.file || ((match.id || '') + '.json')
        };
      });

      setMatchOptions(normalized);
      sel.addEventListener('change', function () { loadMatch(sel.value); });
      await loadMatch(normalized[0].file);
    } catch (err) {
      console.warn('[=78D13=] 读取比赛列表失败：', err);
      sel.innerHTML = '<option value="">暂无可用比赛</option>';
      sel.disabled = true;
      applyConfig({});
    }
  }

  /* =========================================================
   *  渲染：比赛信息 / 队伍
   * ========================================================= */

  function renderMatchInfo() {
    const grid = document.getElementById('matchInfoGrid');
    grid.innerHTML = '';

    MATCH_FIELDS.forEach(function (f) {
      const val = String(configValues[f.key] || '').trim() || '暂未发布';

      const item = document.createElement('div');
      item.className = 'info-item';

      const k = document.createElement('div');
      k.className = 'k';
      k.textContent = f.label;

      const v = document.createElement('div');
      v.className = 'v';
      v.textContent = val;

      item.appendChild(k);
      item.appendChild(v);
      grid.appendChild(item);
    });
  }

  function renderTeams() {
    const sel = document.getElementById('team');
    sel.innerHTML = '';

    const teams = splitList(configValues.teams || '');

    if (!teams.length) {
      const o = document.createElement('option');
      o.value = '';
      o.textContent = '（当前比赛未配置队伍）';
      sel.appendChild(o);
      return;
    }

    const ph = document.createElement('option');
    ph.value = '';
    ph.textContent = '请选择队伍';
    sel.appendChild(ph);

    teams.forEach(function (t) {
      const o = document.createElement('option');
      o.value = t;
      o.textContent = t;
      sel.appendChild(o);
    });
  }

  /* =========================================================
   *  车位
   * ========================================================= */

  function makeInput(type, cls, placeholder, attrs) {
    const inp = document.createElement('input');
    inp.type = type;
    inp.className = cls;
    inp.placeholder = placeholder || '';
    if (attrs) Object.keys(attrs).forEach(function (k) { inp.setAttribute(k, attrs[k]); });
    return inp;
  }

  function makeSelect(options, cls) {
    const sel = document.createElement('select');
    sel.className = cls;
    options.forEach(function (o) {
      const opt = document.createElement('option');
      opt.value = o;
      opt.textContent = o;
      sel.appendChild(opt);
    });
    return sel;
  }

  function makeField(labelText, control) {
    const label = document.createElement('label');
    label.className = 'field';

    const span = document.createElement('span');
    span.textContent = labelText;

    label.appendChild(span);
    label.appendChild(control);
    return label;
  }

  function normalizeVehicleEntry(entry, type, level) {
    if (typeof entry === 'string' || typeof entry === 'number') {
      return { type: type, level: level, name: String(entry), br: '' };
    }
    if (!entry || typeof entry !== 'object') return null;

    const name = entry.name || entry.title || entry.vehicle || entry.名称 || entry.载具名称;
    if (!name) return null;
    return {
      type: entry.type || entry.category || entry.vehicleType || entry.类型 || entry.载具类型 || type,
      level: entry.level || entry.rank || entry.tier || entry.等级 || entry.载具等级 || level,
      name: String(name)
    };
  }

  function normalizeVehicleData(data) {
    const result = [];
    const add = function (entry, type, level) {
      const normalized = normalizeVehicleEntry(entry, type, level);
      if (normalized) result.push(normalized);
    };

    const source = data && data.vehicles ? data.vehicles : data;
    if (Array.isArray(source)) {
      source.forEach(function (entry) { add(entry, '', ''); });
      return result;
    }
    if (!source || typeof source !== 'object') return result;

    Object.keys(source).forEach(function (type) {
      const byLevel = source[type];
      if (Array.isArray(byLevel)) {
        byLevel.forEach(function (entry) { add(entry, type, ''); });
        return;
      }
      if (!byLevel || typeof byLevel !== 'object') return;
      Object.keys(byLevel).forEach(function (level) {
        const entries = Array.isArray(byLevel[level]) ? byLevel[level] : [byLevel[level]];
        entries.forEach(function (entry) { add(entry, type, level); });
      });
    });
    return result;
  }

  function getVehicleEntries(type, level) {
    return vehicleCatalog.filter(function (entry) {
      return (!entry.type || entry.type === type) && (!entry.level || String(entry.level) === level);
    });
  }

  function setSelectOptions(select, options, placeholder) {
    select.innerHTML = '';
    const ph = document.createElement('option');
    ph.value = '';
    ph.textContent = placeholder;
    select.appendChild(ph);
    options.forEach(function (value) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });
  }

  function updateSlotVehicleControls(slot) {
    const type = slot.querySelector('.f-type').value;
    const level = slot.querySelector('.f-level').value;
    const nameInput = slot.querySelector('.f-name');
    const nameSelect = slot.querySelector('.f-name-select');
    const loadoutField = slot.querySelector('.f-loadout-field');
    const currentName = nameInput.value;
    const entries = getVehicleEntries(type, level);
    const names = entries.map(function (entry) { return entry.name; });

    setSelectOptions(nameSelect, names, names.length ? '请选择载具名称' : '暂无载具数据');
    nameSelect.hidden = !names.length;
    nameInput.hidden = names.length > 0;
    if (names.length && names.indexOf(currentName) >= 0) nameSelect.value = currentName;
    if (names.length && nameSelect.value) nameInput.value = nameSelect.value;

    loadoutField.hidden = type === '地面载具' || type === '水面载具';
    if (loadoutField.hidden) slot.querySelector('.f-loadout').value = '';
  }

  function refreshAllSlotVehicleControls() {
    slotsEl.querySelectorAll('.slot').forEach(updateSlotVehicleControls);
  }

  async function loadVehicleCatalog(techTree) {
    const token = ++vehicleLoadToken;
    vehicleCatalog = [];
    refreshAllSlotVehicleControls();
    if (!techTree || !VEHICLE_FILES[techTree]) return;

    try {
      const res = await fetch('config/vehicle_info/' + VEHICLE_FILES[techTree], { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if (!text.trim()) return;
      const data = JSON.parse(text);
      if (token !== vehicleLoadToken) return;
      vehicleCatalog = normalizeVehicleData(data);
      refreshAllSlotVehicleControls();
    } catch (err) {
      if (token !== vehicleLoadToken) return;
      console.warn('[=78D13=] 读取载具配置失败，载具名称可手动填写：', err);
    }
  }

  function createSlot() {
    const el = document.createElement('div');
    el.className = 'slot';

    /* 头部：编号 + 删除 */
    const head = document.createElement('div');
    head.className = 'slot-head';

    const title = document.createElement('span');
    title.className = 'slot-title';
    title.innerHTML = '车位 <b class="slot-index"></b>';

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'btn tiny danger remove-slot';
    removeBtn.textContent = '删除';
    removeBtn.addEventListener('click', function () {
      if (slotsEl.querySelectorAll('.slot').length <= 1) return;
      el.remove();
      renumberSlots();
    });

    head.appendChild(title);
    head.appendChild(removeBtn);
    el.appendChild(head);

    /* 主体：类型、等级、名称、挂载和权重 */
    const grid = document.createElement('div');
    grid.className = 'slot-grid';

    const typeSelect = makeSelect(VEHICLE_TYPES, 'f-type');
    const levelSelect = makeSelect(VEHICLE_LEVELS, 'f-level');
    const nameInput = makeInput('text', 'f-name', '暂无数据时手动填写');
    const nameSelect = makeSelect([], 'f-name-select');
    const nameControls = document.createElement('div');
    nameControls.className = 'vehicle-name-controls';
    nameControls.appendChild(nameSelect);
    nameControls.appendChild(nameInput);

    const loadoutInput = makeInput('text', 'f-loadout', '例如 r24r*2，r60m*4');
    const loadoutField = makeField('载具挂载', loadoutInput);
    loadoutField.classList.add('f-loadout-field');

    grid.appendChild(makeField('载具类型', typeSelect));
    grid.appendChild(makeField('载具等级', levelSelect));
    grid.appendChild(makeField('载具名称', nameControls));
    grid.appendChild(loadoutField);

    typeSelect.addEventListener('change', function () { updateSlotVehicleControls(el); });
    levelSelect.addEventListener('change', function () { updateSlotVehicleControls(el); });
    nameSelect.addEventListener('change', function () {
      nameInput.value = nameSelect.value;
      updateSlotVehicleControls(el);
    });
    nameInput.addEventListener('input', function () { updateSlotVehicleControls(el); });

    el.appendChild(grid);
    updateSlotVehicleControls(el);
    return el;
  }

  function renumberSlots() {
    const els = slotsEl.querySelectorAll('.slot');
    els.forEach(function (el, i) {
      el.querySelector('.slot-index').textContent = i + 1;
      const btn = el.querySelector('.remove-slot');
      if (btn) btn.disabled = els.length <= 1;
    });
  }

  function addSlot() {
    if (slotsEl.querySelectorAll('.slot').length >= maxSlots) {
      alert('您已经消耗了本场比赛允许的最大车位！');
      return;
    }
    slotsEl.appendChild(createSlot());
    renumberSlots();
  }

  /* =========================================================
   *  数据收集
   * ========================================================= */

  function collectData() {
    const slotEls = slotsEl.querySelectorAll('.slot');

    const slots = Array.prototype.map.call(slotEls, function (el, i) {
      const type = el.querySelector('.f-type').value;
      const slot = {
        index: i + 1,
        type: type,
        level: el.querySelector('.f-level').value,
        name: el.querySelector('.f-name').value.trim()
      };

      if (type !== '地面载具' && type !== '水面载具') {
        slot.loadout = el.querySelector('.f-loadout').value.trim();
      }
      return slot;
    });

    return {
      nickname: document.getElementById('nickname').value.trim(),
      gaijinId: document.getElementById('gaijinId').value.trim(),
      team: document.getElementById('team').value,
      identity: document.getElementById('identity').value,
      techTree: document.getElementById('techTree').value,
      slots: slots
    };
  }
  function validateForm(data) {
  if (!data.nickname) return '请填写战雷游戏内昵称';
  if (!data.gaijinId)  return '请搜索或填写玩家 ID';
  if (!data.team)     return '请选择所属队伍';
  if (!data.identity) return '请选择身份';
  if (!data.techTree) return '请选择所用科技树';

  for (let i = 0; i < data.slots.length; i++) {
    const s = data.slots[i];
    const n = i + 1;
    if (!s.level) return '车位 ' + n + '：请选择载具等级';
    if (!s.name)  return '车位 ' + n + '：请填写或选择载具名称';
    if (s.type !== '地面载具' && s.type !== '水面载具' && !s.loadout) {
      return '车位 ' + n + '：请填写载具挂载';
    }
  }
  return null; // 校验通过
  }
  /* =========================================================
   *  JSON 生成
   * ========================================================= */

  function buildJson(data) {
    return JSON.stringify(data, null, 2);
  }

  /* =========================================================
   *  按钮行为
   * ========================================================= */

async function onDownload() {
  const data = collectData();
  const err = validateForm(data);
  if (err) { alert(err); return; }

  const md = buildMarkdown(data);
  const btn = document.getElementById('btnDownload');
  const oldText = btn.textContent;

  // 优先用 Clipboard API
  let ok = false;
  if (navigator.clipboard && window.isSecureContext) {
    try {
      await navigator.clipboard.writeText(md);
      ok = true;
    } catch (e) { ok = false; }
  }

  // 回退：临时 textarea + execCommand
  if (!ok) {
    const ta = document.createElement('textarea');
    ta.value = md;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
  }

  if (ok) {
    btn.textContent = '已复制，请自行发给裁判';
    setTimeout(function () { btn.textContent = oldText; }, 2000);
  } else {
    // 极端情况：弹窗让用户手动复制
    prompt('自动复制失败，请手动复制以下内容：', md);
  }
}

  /* =========================================================
   *  初始化
   * ========================================================= */

  function init() {
    // 科技树下拉
    const techSel = document.getElementById('techTree');
    const ph = document.createElement('option');
    ph.value = '';
    ph.textContent = '请选择科技树';
    techSel.appendChild(ph);

    TECH_TREES.forEach(function (t) {
      const o = document.createElement('option');
      o.value = t;
      o.textContent = t;
      techSel.appendChild(o);
    });
    techSel.addEventListener('change', function () { loadVehicleCatalog(techSel.value); });

    // 初始车位（默认一个）
    slotsEl.appendChild(createSlot());
    renumberSlots();

    // 按钮绑定
    document.getElementById('btnAddSlot').addEventListener('click', addSlot);
    document.getElementById('btnSearchId').addEventListener('click', searchPlayerId);
    document.getElementById('btnDownload').addEventListener('click', onDownload);

    // 从 config/available_matches 读取比赛列表和比赛配置
    loadConfig();
    loadMembers();
    loadVehicleCatalog(techSel.value);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
